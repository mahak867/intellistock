# Full stack:  cp .env.example .env  (set the CHANGE_ME values, ENVIRONMENT=production or staging)  then  docker compose up -d --build
# Web app http://localhost:3000 · API http://localhost:8000 · Streamlit http://localhost:8501 · Flower http://localhost:5555
# Prometheus http://localhost:9090 · Grafana http://localhost:3001

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-intellistock}:${POSTGRES_PASSWORD}@postgres:5432/intellistock
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.api
  image: intellistock-api:local
  env_file: .env
  environment: *app-env
  volumes:
    - models_data:/app/models
    - cache_data:/app/.cache
    - app_data:/app/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellistock
      POSTGRES_USER: ${POSTGRES_USER:-intellistock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?DB password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellistock}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?Redis password required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # API: applies migrations, then serves. Workers and the scheduler wait until it is healthy.
  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: celery -A backend.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.core.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      start_period: 60s
      retries: 3
    depends_on:
      api: { condition: service_healthy }

  # Scheduler: alert checks every ALERT_CHECK_MINUTES, retrain every RETRAIN_INTERVAL_HOURS.
  scheduler:
    <<: *app
    command: celery -A backend.core.celery_app beat --loglevel=info --schedule /app/data/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/data/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      worker: { condition: service_healthy }

  flower:
    <<: *app
    command: celery -A backend.core.celery_app flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/healthcheck', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      worker: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    environment:
      INTELLISTOCK_API_BASE: http://api:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Grafana password required}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  models_data:
  cache_data:
  app_data:
