name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint app components lib
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1

  docker:
    # Builds the API image and starts it against real Postgres and Redis: migrations run, then the health check must answer.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f infra/docker/Dockerfile.api -t intellistock-api .
      - name: Image contains no secrets or local data
        run: |
          docker run --rm --entrypoint sh intellistock-api -c 'test ! -e /app/.env && test ! -d /app/frontend-react && test ! -d /app/.git'
      - name: Start API (migrations + uvicorn) and wait for health
        run: |
          docker run -d --name api --network host \
            -e ENVIRONMENT=staging -e SECRET_KEY=ci-only-secret-key-0123456789abcdef0123 \
            -e DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/ci -e REDIS_URL=redis://localhost:6379/0 \
            intellistock-api
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health; then echo; echo "healthy after ${i}x3s"; break; fi
            sleep 3
          done
          curl -sf http://localhost:8000/api/v1/health
      - name: Migrations reached head
        run: docker exec api alembic current | grep -q "(head)"
      - name: Worker and scheduler import
        run: docker run --rm --network host -e SECRET_KEY=ci-only-secret-key-0123456789abcdef0123 -e DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/ci -e REDIS_URL=redis://localhost:6379/0 intellistock-api celery -A backend.core.celery_app report
      - name: Logs
        if: always()
        run: docker logs api || true

  compose:
    # The whole stack from docker-compose.yml: every service must come up healthy and talk to the others.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Make a .env for the stack
        run: |
          cp .env.example .env
          sed -i -e 's/CHANGE_ME_DB_PASSWORD/ci-db-pass/g' -e 's/CHANGE_ME_REDIS_PASSWORD/ci-redis-pass/g' \
                 -e 's/CHANGE_ME_GRAFANA_PASSWORD/ci-grafana-pass/g' \
                 -e "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" \
                 -e 's/^ENVIRONMENT=.*/ENVIRONMENT=staging/' -e 's/^DEBUG=.*/DEBUG=false/' .env
      - name: Build and start everything (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Every service answers
        run: |
          docker compose ps
          curl -sf http://localhost:8000/api/v1/health && echo " api ok"
          curl -sf -o /dev/null http://localhost:3000/login && echo "web ok"
          curl -sf http://localhost:8501/_stcore/health && echo " dashboard ok"
          curl -sf http://localhost:5555/healthcheck && echo " flower ok"
          docker compose exec -T worker celery -A backend.core.celery_app inspect ping --timeout 10 | grep -q pong && echo "worker ok"
          docker compose exec -T scheduler test -s /app/data/celerybeat-schedule && echo "scheduler ok"
          docker compose exec -T api alembic current | grep -q "(head)" && echo "migrations at head"
      - name: A scheduled task runs through the worker
        run: |
          docker compose exec -T api python -c "from backend.core.celery_app import check_alerts; r = check_alerts.delay().get(timeout=180); print(r); assert 'checked' in r"
      - name: Prometheus scrapes the API
        run: |
          for i in $(seq 1 20); do
            if curl -s 'http://localhost:9090/api/v1/targets' | grep -q '"health":"up"'; then echo "prometheus scraping api"; exit 0; fi
            sleep 5
          done
          curl -s http://localhost:9090/api/v1/targets; exit 1
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=80
      - name: Tear down
        if: always()
        run: docker compose down -v
